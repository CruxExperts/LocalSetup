name: qc-release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qc-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-readiness:
    name: release readiness qc
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.21"
          prune-cache: true

      - name: Sync dependencies
        run: uv sync --frozen --all-groups --python python3

      - name: Run release readiness
        run: uv run --frozen python tools/qc_patrol/cli.py release-readiness --repo . --out qc-out

      - name: Upload QC artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qc-release-${{ github.sha }}
          path: qc-out/
