name: qc-pr-review

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  pr-review:
    name: pr qc review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false

      - name: Checkout subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          path: qc-subject
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.21"
          prune-cache: true

      - name: Sync dependencies
        run: uv sync --frozen --all-groups --python python3

      - name: Resolve QC tooling route
        id: qc_route
        run: |
          set -euo pipefail
          qc_route="trusted-base"
          qc_reason="trusted-base-compatible"

          if [[ ! -f tools/qc_patrol/cli.py ]]; then
            qc_route="subject-no-secret"
            qc_reason="trusted-base-tool-unavailable"
          else
            probe_status=0
            uv run --frozen python - <<'PY' || probe_status=$?
          import ast
          from pathlib import Path

          from tools.qc_patrol.deterministic_checks import check_release_exclusions

          subject = Path("qc-subject").resolve()
          accepted_relative = "ls/config/pack.yaml"
          accepted_pack = subject / accepted_relative
          trusted_source = Path("tools/qc_patrol/deterministic_checks.py")
          subject_source = subject / trusted_source

          def declares_capability(path: Path) -> bool:
              tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              return any(
                  isinstance(node, ast.Constant)
                  and isinstance(node.value, str)
                  and node.value == accepted_relative
                  for node in ast.walk(tree)
              )

          try:
              check_release_exclusions(subject)
          except FileNotFoundError:
              accepted_capability = bool(
                  accepted_pack.is_file()
                  and subject_source.is_file()
                  and declares_capability(subject_source)
              )
              trusted_capability = declares_capability(trusted_source)
              if accepted_capability and not trusted_capability:
                  raise SystemExit(42)
              raise
          PY
            if [[ "$probe_status" -eq 42 ]]; then
              qc_route="subject-no-secret"
              qc_reason="trusted-base-layout-incompatible"
            elif [[ "$probe_status" -ne 0 ]]; then
              exit "$probe_status"
            fi
          fi

          if [[ "$qc_route" == "subject-no-secret" && ! -f qc-subject/tools/qc_patrol/cli.py ]]; then
            echo "Subject QC tooling is unavailable." >&2
            exit 1
          fi

          {
            echo "route=$qc_route"
            echo "reason=$qc_reason"
          } >>"$GITHUB_OUTPUT"

      - name: Run trusted-base PR QC review
        if: steps.qc_route.outputs.route == 'trusted-base'
        env:
          LLM_MODE: ${{ vars.QC_PR_LLM_ENABLED == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && 'auto' || 'off' }}
          QC_LLM_BASE_URL: ${{ vars.QC_PR_LLM_ENABLED == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && secrets.QC_LLM_BASE_URL || '' }}
          QC_LLM_API_KEY: ${{ vars.QC_PR_LLM_ENABLED == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && secrets.QC_LLM_API_KEY || '' }}
          QC_LLM_ORGANIZATION: ${{ vars.QC_PR_LLM_ENABLED == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && secrets.QC_LLM_ORGANIZATION || '' }}
          QC_LLM_PROJECT: ${{ vars.QC_PR_LLM_ENABLED == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && secrets.QC_LLM_PROJECT || '' }}
          QC_LLM_MODEL: ${{ vars.QC_LLM_MODEL }}
          QC_LLM_TEMPERATURE: ${{ vars.QC_LLM_TEMPERATURE }}
          QC_LLM_MAX_TOKENS: ${{ vars.QC_LLM_MAX_TOKENS }}
          QC_LLM_TIMEOUT_SECONDS: ${{ vars.QC_LLM_TIMEOUT_SECONDS }}
          QC_LLM_RETRY_COUNT: ${{ vars.QC_LLM_RETRY_COUNT }}
          QC_LLM_API_STYLE: ${{ vars.QC_LLM_API_STYLE }}
          QC_LLM_ENDPOINT_ALIAS: ${{ vars.QC_LLM_ENDPOINT_ALIAS }}
          QC_PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          QC_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          QC_BASE_REMOTE: https://github.com/${{ github.repository }}.git
        run: |
          set -euo pipefail
          uv run --frozen python tools/qc_patrol/cli.py pr-review \
            --subject-repo qc-subject \
            --base "$QC_PR_BASE_SHA" \
            --head "$QC_PR_HEAD_SHA" \
            --base-remote "$QC_BASE_REMOTE" \
            --out qc-out \
            --llm-mode "$LLM_MODE"

      - name: Run no-secret subject PR QC review
        if: steps.qc_route.outputs.route == 'subject-no-secret'
        env:
          QC_PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          QC_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          QC_BASE_REMOTE: https://github.com/${{ github.repository }}.git
        run: |
          set -euo pipefail
          env \
            -u LLM_MODE \
            -u QC_LLM_BASE_URL \
            -u QC_LLM_API_KEY \
            -u QC_LLM_ORGANIZATION \
            -u QC_LLM_PROJECT \
            -u QC_LLM_MODEL \
            -u QC_LLM_TEMPERATURE \
            -u QC_LLM_MAX_TOKENS \
            -u QC_LLM_TIMEOUT_SECONDS \
            -u QC_LLM_RETRY_COUNT \
            -u QC_LLM_API_STYLE \
            -u QC_LLM_ENDPOINT_ALIAS \
            -u GITHUB_TOKEN \
            -u GH_TOKEN \
            uv run --frozen python qc-subject/tools/qc_patrol/cli.py pr-review \
              --subject-repo qc-subject \
              --base "$QC_PR_BASE_SHA" \
              --head "$QC_PR_HEAD_SHA" \
              --base-remote "$QC_BASE_REMOTE" \
              --out qc-out \
              --llm-mode off

      - name: Summarize PR QC
        env:
          QC_ROUTE: ${{ steps.qc_route.outputs.route }}
          QC_ROUTE_REASON: ${{ steps.qc_route.outputs.reason }}
        run: |
          set -euo pipefail
          {
            echo "## QC PR Review"
            echo
            if [[ "$QC_ROUTE" == "subject-no-secret" ]]; then
              echo "Tooling: subject checkout (no-secret fallback)"
              echo "LLM mode: off"
              echo "Fallback reason: ${QC_ROUTE_REASON}"
              echo
              if [[ "$QC_ROUTE_REASON" == "trusted-base-tool-unavailable" ]]; then
                echo "Trusted base tooling was unavailable; ran a no-secret bootstrap review from the subject checkout."
              else
                echo "Trusted base tooling could not consume the accepted subject layout; ran a no-secret bootstrap review from the subject checkout."
              fi
            else
              echo "Tooling: trusted base checkout"
              echo "LLM mode: explicit repository opt-in (QC_PR_LLM_ENABLED=true)"
              echo "Route reason: ${QC_ROUTE_REASON}"
            fi
            echo
            echo '```json'
            cat qc-out/ledger.json
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Upload QC artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qc-pr-review-${{ github.sha }}
          path: qc-out/
