name: provenance-refresh

on:
  schedule:
    - cron: "0 6 * * *"
      timezone: America/Chicago
  workflow_dispatch:

permissions: {}

concurrency:
  group: provenance-refresh
  cancel-in-progress: false

jobs:
  herdr-watch:
    if: github.ref == 'refs/heads/main'
    name: compare Herdr provenance and hand off confirmed drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout canonical provenance
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.21"
          prune-cache: true

      - name: Install locked runtime dependencies
        run: uv sync --frozen --no-dev --python python3

      - name: Compare official Herdr evidence and create review handoffs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          set +e
          uv run --frozen --no-dev python tools/provenance_refresh.py | tee "$RUNNER_TEMP/provenance-refresh-report.json"
          status=$?
          set -e
          {
            echo '## Herdr provenance observation'
            echo 'The report covers only the canonical Herdr manifest. Unknown observations are not treated as current.'
            echo '```json'
            cat "$RUNNER_TEMP/provenance-refresh-report.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          exit "$status"

      - name: Retain bounded provenance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: herdr-provenance-observation-${{ github.run_id }}
          path: ${{ runner.temp }}/provenance-refresh-report.json
          retention-days: 30
          if-no-files-found: warn
