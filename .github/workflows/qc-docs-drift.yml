name: qc-docs-drift

on:
  schedule:
    - cron: "31 8 * * 2"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: qc-docs-drift
  cancel-in-progress: false

jobs:
  docs-drift:
    name: docs drift qc
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.21"
          prune-cache: true

      - name: Sync dependencies
        run: uv sync --frozen --all-groups --python python3

      - name: Validate product branding
        run: uv run --frozen python ls/tools/validate_branding.py --repo-root . --strict

      - name: Run docs alignment check
        run: uv run --frozen python ls/tools/docs_alignment.py --repo-root . check --ci

      - name: Ensure QC labels exist
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          while IFS='|' read -r label color description; do
            gh label create "$label" --repo "$REPOSITORY" --color "$color" --description "$description" --force >/dev/null 2>&1 || true
          done <<'LABELS'
          qc-patrol|5319e7|Automated QC patrol finding
          ai-generated|cfd3d7|Generated by an AI-assisted repository check
          needs-planning-review|fbca04|Needs maintainer planning review
          qc/category/workflow_security|fef2c0|QC workflow security category
          qc/category/release|fef2c0|QC release category
          qc/category/docs|fef2c0|QC docs category
          qc/category/pr_review|fef2c0|QC PR review category
          qc/severity/low|c2e0c6|Low severity QC finding
          qc/severity/medium|fbca04|Medium severity QC finding
          qc/severity/high|d93f0b|High severity QC finding
          qc/severity/critical|b60205|Critical severity QC finding
          LABELS

      - name: Run docs drift handoff
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --frozen python tools/qc_patrol/cli.py docs-drift --repo . --out qc-out --write-issues

      - name: Upload QC artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qc-docs-drift-${{ github.sha }}
          path: qc-out/
