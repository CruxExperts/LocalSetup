name: triage

on:
  workflow_dispatch:
  issues:
    types:
      - opened
      - reopened
  pull_request_target:
    types:
      - opened
      - reopened
      - ready_for_review

concurrency:
  group: triage-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

permissions:
  issues: write
  pull-requests: write

jobs:
  bootstrap-labels:
    name: bootstrap labels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ensure maintainer labels exist
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number || '' }}
        run: |
          set -euo pipefail

          case "$EVENT_NAME" in
            issues|pull_request_target) ;;
            workflow_dispatch) ;;
            *) printf '%s\n' "Unsupported event type; no labels were changed." >&2; exit 1 ;;
          esac

          if [[ "$EVENT_NAME" != "workflow_dispatch" && ! "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            printf '%s\n' "Missing or invalid item number; no labels were changed." >&2
            exit 1
          fi

          read_repository_labels() {
            gh api --paginate --jq '.[].name' "repos/${REPOSITORY}/labels"
          }

          if ! current_labels="$(read_repository_labels 2>/dev/null)"; then
            printf '%s\n' "Unable to read repository labels; no labels were changed." >&2
            exit 1
          fi

          declare -A known_labels=()
          while IFS= read -r label; do
            [[ -n "$label" ]] && known_labels["$label"]=1
          done <<< "$current_labels"

          while IFS='|' read -r label color description; do
            [[ -z "$label" || "$label" == \#* ]] && continue
            [[ -n "${known_labels[$label]+present}" ]] && continue

            if gh label create "$label" --repo "$REPOSITORY" --color "$color" --description "$description" >/dev/null 2>&1; then
              known_labels["$label"]=1
              continue
            fi

            if ! current_labels="$(read_repository_labels 2>/dev/null)"; then
              printf 'Unable to confirm label "%s" after creation failed.\n' "$label" >&2
              exit 1
            fi
            if ! grep -Fqx -- "$label" <<< "$current_labels"; then
              printf 'Could not create label "%s"; it was not present on read-back.\n' "$label" >&2
              exit 1
            fi
            known_labels["$label"]=1
          done <<'LABELS'
          status/needs-triage|c5def5|Needs maintainer triage
          status/blocked|b60205|Blocked by an external dependency or decision
          status/accepted|0e8a16|Accepted for implementation
          status/ready|0e8a16|Ready for review or merge
          type/bug|d73a4a|Confirmed or suspected defect
          type/feature|a2eeef|Feature request or enhancement
          type/maintenance|ededed|Repository maintenance or release work
          type/pr|d4c5f9|Pull request
          type/support|bfdadc|Support or usage question
          area/docs|fef2c0|Documentation or generated docs
          area/installer|fef2c0|Installer, bootstrap, conversion, or rollback
          area/skills|fef2c0|Skills, workflows, or packs
          area/release|fef2c0|Versioning, publishing, tags, or artifacts
          area/automation|fef2c0|GitHub Actions, bots, or automation
          area/python|fef2c0|Python dependencies or runtime behavior
          priority/high|b60205|High priority
          priority/normal|fbca04|Normal priority
          priority/low|c2e0c6|Low priority
          good first issue|7057ff|Good for a first contribution
          help wanted|008672|Extra maintainer or contributor help wanted
          security|b60205|Security-sensitive report or hardening
          release|5319e7|Release-related work
          docs|0075ca|Documentation work
          needs-repro|d876e3|Needs reproduction details
          dependencies|0366d6|Dependency update
          LABELS

  metadata-labels:
    name: metadata labels
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - bootstrap-labels
    steps:
      - name: Apply triage labels
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          TITLE: ${{ github.event.issue.title || github.event.pull_request.title }}
          BODY: ${{ github.event.issue.body || github.event.pull_request.body || '' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          case "$EVENT_NAME" in
            issues|pull_request_target) ;;
            *) printf '%s\n' "Unsupported event type; no labels were changed." >&2; exit 1 ;;
          esac

          if [[ ! "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            printf '%s\n' "Missing or invalid item number; no labels were changed." >&2
            exit 1
          fi

          if ! current_labels="$(gh api --paginate --jq '.[].name' "repos/${REPOSITORY}/issues/${ISSUE_NUMBER}/labels" 2>/dev/null)"; then
            printf '%s\n' "Unable to read current item labels; no labels were changed." >&2
            exit 1
          fi

          declare -A existing_labels=()
          while IFS= read -r label; do
            [[ -n "$label" ]] && existing_labels["$label"]=1
          done <<< "$current_labels"

          has_label_prefix() {
            local prefix="$1"
            local existing
            for existing in "${!existing_labels[@]}"; do
              [[ "$existing" == "$prefix"* ]] && return 0
            done
            return 1
          }

          add_label_if_missing() {
            local label="$1"
            if [[ -z "${existing_labels[$label]+present}" ]]; then
              labels+=("$label")
              existing_labels["$label"]=1
            fi
          }

          labels=()
          if ! has_label_prefix "status/"; then
            add_label_if_missing "status/needs-triage"
          fi

          text="$(printf '%s\n%s\n' "$TITLE" "$BODY" | tr '[:upper:]' '[:lower:]')"
          if ! has_label_prefix "type/"; then
            if [[ "$EVENT_NAME" == "pull_request_target" ]]; then
              add_label_if_missing "type/pr"
            elif grep -Eq '\bbug|error|fail|broken|regression\b' <<< "$text"; then
              add_label_if_missing "type/bug"
            elif grep -Eq '\bfeat|feature|request|enhancement\b' <<< "$text"; then
              add_label_if_missing "type/feature"
            else
              add_label_if_missing "type/support"
            fi
          fi

          grep -Eq '\bdocs?|readme|generated docs?\b' <<< "$text" && add_label_if_missing "area/docs"
          grep -Eq '\binstall|installer|wizard|bootstrap|convert\b' <<< "$text" && add_label_if_missing "area/installer"
          grep -Eq '\bskill|workflow|pack\b' <<< "$text" && add_label_if_missing "area/skills"
          grep -Eq '\brelease|version|publish|tag|artifact\b' <<< "$text" && add_label_if_missing "area/release"
          grep -Eq '\bsecurity|vulnerab|secret|token|credential\b' <<< "$text" && add_label_if_missing "security"

          if ((${#labels[@]})); then
            args=()
            for label in "${labels[@]}"; do
              args+=("-f" "labels[]=${label}")
            done
            gh api "repos/${REPOSITORY}/issues/${ISSUE_NUMBER}/labels" "${args[@]}" >/dev/null
          fi

      - name: Write workflow handoff
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          set -euo pipefail

          case "$EVENT_NAME" in
            issues) event_kind="issue" ;;
            pull_request_target) event_kind="pull request" ;;
            *) printf '%s\n' "Unsupported event type." >&2; exit 1 ;;
          esac

          if [[ ! "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            printf '%s\n' "Missing or invalid issue number." >&2
            exit 1
          fi

          {
            printf '%s\n\n' '# Triage handoff'
            printf 'Intake labels were applied to %s #%s. They are metadata hints, not a validity or acceptance decision.\n\n' "$event_kind" "$ISSUE_NUMBER"
            printf '%s\n' '[Continue with the Codex GitHub Issue Goal Loop](https://github.com/CruxExperts/LocalSetup/blob/main/ls/docs/CODEX_GITHUB_ISSUE_GOAL_LOOP.md).'
          } >> "$GITHUB_STEP_SUMMARY"
