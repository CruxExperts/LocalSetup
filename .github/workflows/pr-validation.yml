name: pr-validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          base-ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          head-ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          fail-on-severity: high
          fail-on-scopes: runtime,development,unknown
          vulnerability-check: true
          license-check: false
          warn-only: false
          comment-summary-in-pr: never

  dependency-manifest-validation:
    name: dependency manifest validation
    if: ${{ github.event_name == 'pull_request' && (github.actor == 'dependabot[bot]' || startsWith(github.head_ref, 'dependabot/')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.21"
          prune-cache: true

      - name: Check uv lockfile
        run: |
          set -euo pipefail
          uv lock --check

      - name: Check frozen uv sync remains usable
        run: |
          uv sync --frozen --all-groups --python python3
          uv run --frozen python -c "import yaml, requests, frontmatter, cryptography, pgpy, jsonschema"

  generated-docs-and-version:
    name: generated docs and version sync
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.21"
          prune-cache: true

      - name: Sync dependencies
        run: uv sync --frozen --all-groups --python python3

      - name: Check version and generated docs
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          base_sha=""
          if git log -1 --pretty=%s | grep -q '^chore: sync release version '; then
            base_sha="$(git rev-parse HEAD~2)"
          fi
          for candidate in "$PR_BASE_SHA" "$MERGE_GROUP_BASE_SHA" "$BEFORE_SHA"; do
            if [[ -n "$base_sha" ]]; then
              break
            fi
            if [[ -n "$candidate" && "$candidate" != "0000000000000000000000000000000000000000" ]]; then
              if git cat-file -e "${candidate}^{commit}" 2>/dev/null; then
                base_sha="$candidate"
                break
              fi
            fi
          done

          if [[ -z "$base_sha" ]]; then
            git fetch origin main
            base_sha="$(git merge-base HEAD origin/main)"
          fi

          echo "Checking version plan from ${base_sha} to ${HEAD_SHA}"
          uv run --frozen python ls/tools/localsetup.py --source-root . version-plan --base "$base_sha" --head "$HEAD_SHA"
          uv run --frozen python ls/tools/localsetup.py --source-root . version-sync --check --base "$base_sha" --head "$HEAD_SHA"
          git diff --exit-code

  documentation:
    name: documentation
    uses: ./.github/workflows/docs-sync.yml

  quality:
    name: quality
    uses: ./.github/workflows/qc-ci.yml

  framework-prerequisites:
    name: framework prerequisites
    permissions:
      contents: read
      actions: read
    needs: [generated-docs-and-version, shell-smoke-and-audit, documentation, quality, dependency-review]
    if: >-
      ${{
        !cancelled() &&
        needs.generated-docs-and-version.result == 'success' &&
        needs.shell-smoke-and-audit.result == 'success' &&
        needs.documentation.result == 'success' &&
        needs.quality.result == 'success' &&
        (
          ((github.event_name == 'pull_request' || github.event_name == 'merge_group') && needs.dependency-review.result == 'success') ||
          ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.dependency-review.result == 'skipped')
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      reuse: ${{ steps.evidence.outputs.reuse }}
      test_policy: ${{ steps.test-policy.outputs.json }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.21"
          prune-cache: true

      - name: Sync dependencies
        run: uv sync --frozen --all-groups --python python3

      - name: Resolve test policy
        id: test-policy
        run: |
          set -euo pipefail
          # Admit as many shard jobs as this runner has available logical CPUs,
          # up to the configured shard count. Each job uses its own CPU budget.
          uv run --frozen python ls/tools/localsetup.py --source-root . test-workers --workers "$(nproc)" --json > /tmp/localsetup-test-policy.json
          policy="$(python -c 'import json,sys; print(json.dumps(json.load(open(sys.argv[1])),separators=(",",":")))' /tmp/localsetup-test-policy.json)"
          printf '%s\n' "$policy"
          echo "json=$policy" >> "$GITHUB_OUTPUT"

      - name: Verify framework context
        run: |
          ./ls/tools/verify_context
          ./ls/tools/verify_rules

      - name: Validate product branding
        run: uv run --frozen python ls/tools/validate_branding.py --repo-root . --strict

      - name: Validate Python architecture
        run: uv run --frozen python ls/tools/python_architecture_check.py --repo-root . --baseline ls/config/python-architecture-baseline.json

      - name: Validate catalogs and migration boundaries
        run: |
          uv run --frozen python ls/tools/localsetup.py --source-root . validate-catalog
          uv run --frozen python ls/tools/localsetup.py --source-root . scan-migration
          uv run --frozen python ls/tools/localsetup.py --source-root . skill search context
          uv run --frozen python ls/tools/localsetup.py --source-root . workflow search audit
          uv run --frozen python ls/tools/localsetup.py --source-root . why --packs core
          uv run --frozen python ls/tools/localsetup.py --source-root . graph
          uv run --frozen python ls/tools/localsetup.py --source-root . adopt --target-directory .
          uv run --frozen python ls/tools/localsetup.py --source-root . sbom --out /tmp/localsetup-source.cdx.json


      - name: Reuse successful validation of this exact commit
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python ls/tools/ci_evidence.py --repository "$GITHUB_REPOSITORY" \
            --sha "$CANDIDATE_SHA" --exclude-run-id "$GITHUB_RUN_ID" \
            --job 'framework validation py3.12' \
            --job 'shell smoke and framework audit' \
            --job 'generated docs and version sync' \
            --job 'documentation / generated docs drift' \
            --job 'quality / deterministic qc' > /tmp/ci-evidence.json
          cat /tmp/ci-evidence.json >> "$GITHUB_STEP_SUMMARY"
          if [[ "$GITHUB_EVENT_NAME" = workflow_dispatch ]]; then
            echo "reuse=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "reuse=$(python -c 'import json; print(str(json.load(open("/tmp/ci-evidence.json"))["ok"]).lower())')" >> "$GITHUB_OUTPUT"

  framework-validation:
    name: framework shard ${{ matrix.shard }} py${{ matrix.python-version }}
    needs: framework-prerequisites
    if: >-
      ${{
        !cancelled() &&
        needs.framework-prerequisites.result == 'success' &&
        needs.framework-prerequisites.outputs.reuse != 'true'
      }}
    # Native family layout/history qualification is bound to tmux 3.4.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.framework-prerequisites.outputs.test_policy).max_parallel }}
      matrix:
        python-version: ["3.12"]
        shard: ${{ fromJSON(needs.framework-prerequisites.outputs.test_policy).shard_indices }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.21"
          prune-cache: true

      - name: Sync dependencies
        run: uv sync --frozen --all-groups --python python3

      - name: Verify qualified tmux runtime
        run: |
          set -euo pipefail
          test "$(tmux -V)" = "tmux 3.4"

      - name: Run pytest
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          LOCALSETUP_TEST_WORKERS: ${{ fromJSON(needs.framework-prerequisites.outputs.test_policy).workers_per_shard }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          # The ephemeral runner needs a user manager for the same verified
          # cgroup boundary used by local pytest. Failure stops before workers.
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          sudo systemctl start "user@$(id -u).service"
          systemctl --user show-environment >/dev/null
          uv run --frozen --group s3-sdk pytest -n "$(nproc)" ls/tests -q \
            --ci-shard=${{ matrix.shard }} --ci-shards=${{ fromJSON(needs.framework-prerequisites.outputs.test_policy).shard_count }} \
            --maxfail=1 --durations=20

  framework-result:
    name: framework validation py3.12
    needs: [framework-prerequisites, framework-validation, dependency-review]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all shards or verified prior success
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEPENDENCY_REVIEW: ${{ needs.dependency-review.result }}
          PREREQUISITES: ${{ needs.framework-prerequisites.result }}
          REUSED: ${{ needs.framework-prerequisites.outputs.reuse }}
          SHARDS: ${{ needs.framework-validation.result }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request|merge_group) test "$DEPENDENCY_REVIEW" = success ;;
            push|workflow_dispatch) test "$DEPENDENCY_REVIEW" = skipped ;;
            *) printf '%s\n' "Unsupported validation event." >&2; exit 1 ;;
          esac
          test "$PREREQUISITES" = success
          if [[ "$REUSED" = true ]]; then
            test "$SHARDS" = skipped
          else
            test "$SHARDS" = success
          fi

  shell-smoke-and-audit:
    name: shell smoke and framework audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.21"
          prune-cache: true

      - name: Sync dependencies
        run: uv sync --frozen --all-groups --python python3

      - name: Run framework audit
        run: uv run --frozen python ls/skills/ls-localsetup-framework-audit/scripts/run_framework_audit.py --output /tmp/ls-framework-audit.md

      - name: Run shell smoke tests
        run: uv run --frozen ./ls/tests/automated_test.sh

      - name: Check whitespace-safe diff
        run: git diff --check
