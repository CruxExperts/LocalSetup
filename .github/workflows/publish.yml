name: publish

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Release preparation, published documentation repair, or runtime qualification"
        type: choice
        options: [release, repair, qualify]
        default: release

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  prepare-documentation:
    name: verify committed release documentation
    if: github.ref == 'refs/heads/main' || inputs.mode == 'qualify'
    runs-on: ubuntu-latest
    timeout-minutes: 165
    permissions:
      contents: write
    outputs:
      head: ${{ steps.evidence.outputs.head }}
      state: ${{ steps.evidence.outputs.state }}
    steps:
      - name: Checkout source candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Qualify runner-owned Python permissions
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import stat
          import sys
          executable = Path(sys.executable).resolve(strict=True)
          tool_root = Path(os.environ["pythonLocation"]).resolve(strict=True)
          info = executable.stat()
          if not executable.is_relative_to(tool_root) or not stat.S_ISREG(info.st_mode):
              raise SystemExit("Expected a regular setup-python executable")
          if info.st_uid == os.getuid():
              executable.chmod(stat.S_IMODE(info.st_mode) & ~0o022)
          info = executable.stat()
          if info.st_uid not in {0, os.getuid()} or info.st_mode & 0o022:
              raise SystemExit("Runner Python does not satisfy protected-runtime ownership and permissions")
          PY
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.21"
          prune-cache: true
      - name: Sync locked tooling
        run: uv sync --frozen --all-groups --python python3
      - name: Allocate task evidence
        id: evidence
        run: |
          state=".agents/state/$(date -u +%Y%m%d-%H%M%S)-$(git rev-parse --short HEAD)-release-docs"
          mkdir -p "$state"
          echo "RELEASE_DOCS_STATE=$state" >> "$GITHUB_ENV"
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Provision protected completion runtime
        if: inputs.mode == 'qualify'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run --frozen python -m ls.core.release_docs.runtime \
            --runtime-root "$RUNNER_TEMP/release-docs-runtime" \
            --assets-dir "$RUNNER_TEMP/release-docs-inputs" \
            --python "$(command -v python)"
      - name: Audit, propose, and independently review documentation
        if: inputs.mode == 'qualify'
        env:
          GH_TOKEN: ${{ github.token }}
          QC_LLM_API_KEY: ${{ secrets.QC_LLM_API_KEY }}
          QC_LLM_BASE_URL: ${{ secrets.QC_LLM_BASE_URL }}
          QC_LLM_MODEL: ${{ vars.QC_LLM_MODEL }}
          QC_LLM_API_STYLE: ${{ vars.QC_LLM_API_STYLE }}
          QC_LLM_MAX_TOKENS: ${{ vars.QC_LLM_MAX_TOKENS }}
          # The total deadline covers the full release-docs preparation session.
          # Each provider request separately defaults to a 180 second timeout.
          QC_LLM_TIMEOUT_SECONDS: ${{ vars.QC_LLM_TIMEOUT_SECONDS || '180' }}
          QC_LLM_MAX_CALLS: ${{ vars.QC_LLM_MAX_CALLS || '800' }}
          QC_LLM_TOTAL_DEADLINE_SECONDS: ${{ vars.QC_LLM_TOTAL_DEADLINE_SECONDS || '9000' }}
          QC_LLM_RUNTIME_ROOT: ${{ runner.temp }}/release-docs-runtime
        run: |
          uv run --frozen python ls/tools/localsetup.py --source-root . release-docs prepare \
            --verify-baseline --candidate "$RELEASE_DOCS_STATE/candidate.json"
      - name: Check committed documentation
        run: |
          uv run --frozen python ls/tools/localsetup.py --source-root . release-docs check
          uv run --frozen python ls/tools/docs_alignment.py --repo-root . check --ci
          uv run --frozen python ls/tools/validate_branding.py --repo-root . --strict > "$RELEASE_DOCS_STATE/branding.json"
          git diff --exit-code
      - name: Check published repair boundary
        if: inputs.mode == 'repair'
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --frozen python ls/tools/localsetup.py --source-root . release-docs plan --verify-baseline --repair
      - name: Repair published release prose without rebuilding
        if: inputs.mode == 'repair'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$(cat VERSION)"
          test "$(git cat-file -t "refs/tags/${tag}")" = tag
          git merge-base --is-ancestor "refs/tags/${tag}^{commit}" HEAD
          signer='AF7968466B5B39C5E928FEFE716342D3EFBA5522'
          export GNUPGHOME="$RUNNER_TEMP/release-tag-gpg"
          mkdir -m 700 "$GNUPGHOME"
          curl --fail --silent --show-error --location https://github.com/CruxExperts.gpg -o "$RELEASE_DOCS_STATE/signer.asc"
          gpg --batch --import "$RELEASE_DOCS_STATE/signer.asc" >/dev/null
          git -c gpg.format=openpgp -c gpg.program=gpg verify-tag --raw "$tag" > "$RELEASE_DOCS_STATE/tag-status" 2>&1
          grep -Eq "^\[GNUPG:\] VALIDSIG ${signer}( |$)" "$RELEASE_DOCS_STATE/tag-status"
          gh release view "$tag" --json tagName,isDraft,assets > "$RELEASE_DOCS_STATE/published.json"
          jq -e --arg tag "$tag" --arg version "$(cat VERSION)" '
            .tagName == $tag and .isDraft == false and
            ([.assets[].name] | index("localsetup-v" + $version + ".tar.gz") != null and
             index("localsetup-v" + $version + ".tar.gz.sha256") != null and
             index("localsetup-v" + $version + ".tar.gz.cdx.json") != null)
          ' "$RELEASE_DOCS_STATE/published.json" >/dev/null
          uv run --frozen python ls/tools/localsetup.py --source-root . release-docs notes > "$RELEASE_DOCS_STATE/notes.md"
          gh release edit "$tag" --notes-file "$RELEASE_DOCS_STATE/notes.md"
      - name: Upload preparation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-docs-${{ github.run_id }}
          path: ${{ env.RELEASE_DOCS_STATE }}/

  publish:
    needs: prepare-documentation
    if: github.ref == 'refs/heads/main' && inputs.mode == 'release'
    name: publish release
    env:
      RELEASE_DOCS_STATE: ${{ needs.prepare-documentation.outputs.state }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare-documentation.outputs.head }}

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.21"
          prune-cache: true

      - name: Sync dependencies
        run: uv sync --frozen --all-groups --python python3

      - name: Resolve release base
        id: release-base
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ needs.prepare-documentation.outputs.head }}
        run: |
          set -euo pipefail
          base_sha="$BEFORE_SHA"
          # This is comparison metadata. The committed release policy selects
          # the verified arithmetic anchor through the canonical planner.
          if [[ -z "$base_sha" || "$base_sha" == "0000000000000000000000000000000000000000" ]] || ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            base_sha="$(git rev-parse HEAD^)"
          fi
          echo "base-sha=${base_sha}" >>"$GITHUB_OUTPUT"
          echo "head-sha=${HEAD_SHA}" >>"$GITHUB_OUTPUT"

      - name: Check release version sync
        run: |
          set -euo pipefail
          base_sha="${{ steps.release-base.outputs.base-sha }}"
          head_sha="${{ steps.release-base.outputs.head-sha }}"
          uv run --frozen python ls/tools/localsetup.py --source-root . version-plan --base "$base_sha" --head "$head_sha"
          uv run --frozen python ls/tools/localsetup.py --source-root . version-sync --check --base "$base_sha" --head "$head_sha"

      - name: Validate product branding
        run: uv run --frozen python ls/tools/validate_branding.py --repo-root . --strict

      - name: Check release documentation before building
        run: uv run --frozen python ls/tools/localsetup.py --source-root . release-docs check

      - name: Verify pre-existing signed release tag and commit
        env:
          RELEASE_COMMIT: ${{ needs.prepare-documentation.outputs.head }}
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          tag="v${version}"
          signer='AF7968466B5B39C5E928FEFE716342D3EFBA5522'
          test "$(git cat-file -t "refs/tags/${tag}")" = tag
          test "$(git rev-parse "refs/tags/${tag}^{commit}")" = "$RELEASE_COMMIT"
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          remote_tag="$(git ls-remote --exit-code origin "refs/tags/${tag}" | cut -f1)"
          test "$remote_tag" = "$(git rev-parse "refs/tags/${tag}")"
          remote_commit="$(git ls-remote --exit-code origin "refs/tags/${tag}^{}" | cut -f1)"
          test "$remote_commit" = "$RELEASE_COMMIT"
          mkdir -p "$RELEASE_DOCS_STATE"
          export GNUPGHOME="$RUNNER_TEMP/release-tag-gpg"
          mkdir -m 700 "$GNUPGHOME"
          curl --fail --silent --show-error --location https://github.com/CruxExperts.gpg -o "$RELEASE_DOCS_STATE/signer.asc"
          gpg --batch --import "$RELEASE_DOCS_STATE/signer.asc" >/dev/null
          git -c gpg.format=openpgp -c gpg.program=gpg verify-tag --raw "$tag" > "$RELEASE_DOCS_STATE/tag-status" 2>&1
          grep -Eq "^\[GNUPG:\] VALIDSIG ${signer}( |$)" "$RELEASE_DOCS_STATE/tag-status"
          git -c gpg.format=openpgp -c gpg.program=gpg verify-commit --raw "$RELEASE_COMMIT" > "$RELEASE_DOCS_STATE/commit-status" 2>&1
          grep -Eq "^\[GNUPG:\] VALIDSIG ${signer}( |$)" "$RELEASE_DOCS_STATE/commit-status"

      - name: Run publish validation
        run: |
          set -euo pipefail
          uv run --frozen python ls/tools/generate_docs_artifacts.py --repo-root .
          uv run --frozen python ls/tools/localsetup.py --source-root . generate-docs
          git diff --exit-code
          uv run --frozen python ls/tools/localsetup.py --source-root . validate-catalog
          uv run --frozen python ls/tools/python_architecture_check.py --repo-root . --baseline ls/config/python-architecture-baseline.json
          uv run --frozen python ls/skills/ls-framework-audit/scripts/run_framework_audit.py --output /tmp/ls-framework-audit.md
          workers="$(uv run --frozen python ls/tools/localsetup.py --source-root . test-workers)"
          uv run --frozen --group s3-sdk pytest -n "$workers" ls/tests -q
          uv run --frozen ./ls/tests/automated_test.sh
          git diff --check

      - name: Build public artifact
        run: uv run --frozen python ls/tools/localsetup.py --source-root . package --out dist/localsetup-v$(cat VERSION).tar.gz

      - name: Verify release artifact
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          uv run --frozen python ls/tools/localsetup.py --source-root . verify-release "dist/localsetup-v${version}.tar.gz" --expected-commit "$(git rev-parse HEAD)"

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: localsetup-release-${{ needs.prepare-documentation.outputs.head }}
          path: |
            dist/localsetup-v*.tar.gz
            dist/localsetup-v*.tar.gz.sha256
            dist/localsetup-v*.tar.gz.cdx.json

      - name: Attest release tarball
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/localsetup-v*.tar.gz

      - name: Prepare GitHub release draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.prepare-documentation.outputs.head }}
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          tag="v${version}"
          mkdir -p "$RELEASE_DOCS_STATE"
          uv run --frozen python ls/tools/localsetup.py --source-root . release-docs notes > "$RELEASE_DOCS_STATE/notes.md"
          response="$(mktemp)"
          errors="$(mktemp)"
          trap 'rm -f "$response" "$errors"' EXIT
          if gh api --include "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" >"$response" 2>"$errors"; then
            echo "Release ${tag} already exists; reconcile its commit and assets before retrying." >&2
            exit 1
          elif ! grep -Eq '^HTTP/[0-9.]+ 404([[:space:]]|$)' "$response"; then
            cat "$errors" >&2
            echo "Could not establish that release ${tag} is absent; no draft created." >&2
            exit 1
          fi
          gh release create "${tag}" \
            "dist/localsetup-v${version}.tar.gz" \
            "dist/localsetup-v${version}.tar.gz.sha256" \
            "dist/localsetup-v${version}.tar.gz.cdx.json" \
            --draft \
            --verify-tag \
            --target "$RELEASE_COMMIT" \
            --title "LocalSetup ${version}" \
            --notes-file "$RELEASE_DOCS_STATE/notes.md"
