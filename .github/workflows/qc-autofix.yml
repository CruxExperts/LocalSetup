name: qc-autofix

on:
  workflow_dispatch:
    inputs:
      issue:
        description: "QC issue number or allowlist id"
        required: true
      dry_run:
        description: "Run without creating a PR"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: qc-autofix-${{ github.event.inputs.issue }}
  cancel-in-progress: false

jobs:
  autofix:
    name: manual qc autofix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.21"
          prune-cache: true

      - name: Sync dependencies
        run: uv sync --frozen --all-groups --python python3

      - name: Plan autofix
        env:
          QC_AUTOFIX_ISSUE: ${{ github.event.inputs.issue }}
          QC_AUTOFIX_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          uv run --frozen python tools/qc_patrol/cli.py autofix \
            --issue "$QC_AUTOFIX_ISSUE" \
            --dry-run "$QC_AUTOFIX_DRY_RUN" \
            --create-pr true \
            --out qc-out

      - name: Upload QC artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qc-autofix-${{ github.sha }}
          path: qc-out/
