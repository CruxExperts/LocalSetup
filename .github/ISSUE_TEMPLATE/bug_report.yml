name: Bug report
description: Report an install, docs, skill, workflow, or packaging problem.
title: "fix: "
labels:
  - status/needs-triage
  - type/bug
body:
  - type: markdown
    attributes:
      value: >-
        **Security report:** If this may be a vulnerability, use [private vulnerability reporting](https://github.com/CruxExperts/localsetup/security/advisories/new).
        Do not include secrets, private paths, or sensitive information in this public issue.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the problem in one or two sentences.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: LocalSetup version
      description: Paste the value from `cat VERSION`, commit, or release tag.
      placeholder: "4.0.2 / release tag / commit SHA"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Client or platform
      description: Name the client or platform and relevant version, or enter `not platform-specific`.
      placeholder: "Cursor, Claude Code, Codex, another client, or not platform-specific"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, WSL2 context if relevant, shell, Python version, and Git version.
      placeholder: |
        OS:
        WSL2:
        Shell:
        Python:
        Git:
    validations:
      required: true
  - type: textarea
    id: target
    attributes:
      label: LocalSetup target
      description: Include pack/workflow/skill ID, install mode, and repo path shape when relevant.
      placeholder: |
        Pack/workflow:
        Skill:
        Install mode:
        Repo path shape:
  - type: textarea
    id: command
    attributes:
      label: Steps to reproduce
      description: List the commands or UI actions that reproduce the issue. Include exact commands when relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation output
      description: Paste the shortest relevant output from validation commands.
      render: shell
  - type: checkboxes
    id: impact
    attributes:
      label: Impact area
      options:
        - label: Generated docs are involved.
        - label: Public package contents or private path boundaries are involved.
        - label: Install or rollback behavior is involved.
        - label: Platform-specific behavior is involved.
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add a workflow-run URL, failing commit, or last-known-good version when available, plus any other context that helps reproduce the issue.
