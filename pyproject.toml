[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "localsetup"
version = "4.44.1"
description = "Global-first LocalSetup skill pack manager"
requires-python = ">=3.12"
dependencies = [
  "PyYAML>=6.0.3",
  "requests>=2.34.2",
  "python-frontmatter>=1.3.0",
  "cryptography>=50.0.0",
  "PGPy>=0.6.0",
  "pyasn1>=0.6.4",
  "jsonschema>=4.26.0",
  "anyio>=4.7.0",
  "genai-prices>=0.1.6",
  "griffelib>=2.0",
  "httpx2>=2.7",
  "httpx>=0.28.1",
  "logfire-api>=3.14.1",
  "openai>=3.0.0",
  "opentelemetry-api>=1.28.0",
  "pydantic>=2.12",
  "tiktoken>=0.12.0",
  "typing-inspection>=0.4.0",
]

[dependency-groups]
sdk-build = [
  "setuptools==84.0.0",
  "wheel==0.48.0",
  "packaging==26.3",
]
dev = [
  "cairosvg==2.9.1",
  "pillow==12.3.0",
  "pytest>=9.1.1",
  "pytest-xdist>=3.6",
  "setuptools==84.0.0",
]
s3-sdk = [
    "boto3==1.43.89",
]

[project.scripts]
localsetup = "ls.core.cli:main"
lscli = "ls.core.agent.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.cmdclass]
build_py = "ls.core.sdk_payload.build.BuildSDK"

[tool.setuptools.packages.find]
include = ["ls*"]

[tool.setuptools.package-data]
"ls" = [
  "config/*.json",
  "config/*.lock",
  "config/*.yaml",
  "docs/*.md",
  "docs/*.yaml",
  "docs/_generated/*.md",
  "docs/_generated/*.json",
  "docs/migration/*.md",
  "docs/ops/*.md",
  "docs/releases/*.md",
  "docs/releases/*.json",
  "discovery/**/*",
  "lib/*",
  "tools/*",
  "tools/**/*",
  "skills/**/*",
  "templates/**/*",
  "workflows/**/*",
]

[tool.setuptools.exclude-package-data]
"*" = [
  "docs/local-context/*",
  "docs/local-context/**/*",
  "ls/docs/local-context/*",
  "ls/docs/local-context/**/*",
  ".cache/**",
  "**/.cache/**",
  "skills/*/scripts/data/*",
  "skills/*/scripts/data/**/*",
  "workflows/*/scripts/data/*",
  "workflows/*/scripts/data/**/*",
  "**/__pycache__/**",
  "**/*.pyc",
  "**/*.pyo",
]

[tool.uv]
build-constraint-dependencies = [
  "setuptools==84.0.0",
  "wheel==0.48.0",
  "packaging==26.3",
]
