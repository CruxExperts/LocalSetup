# Smoke commands per skill for framework audit (skill matrix).
# Schema: skill_id (from ls/skills/<name>/) -> command string, "N/A",
# or {cwd: skill-sandbox|repo-root, command: "..."}.
# String commands run with cwd = sandbox copy of the skill (see ls-skill-sandbox-tester).
# Structured repo-root commands run from the repository root for source-tree tools.
# N/A = doc-only skill; no runnable tooling to smoke. Audit uses agent step summary only.
# Path and schema documented in ls-localsetup-framework-audit SKILL.md.

