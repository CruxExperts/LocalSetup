workflow_id: pr-review-feedback-fixes
display_name: Pull Request Review Feedback Fixes
aliases: ["pr feedback pipeline", "ls-workflow-pipeline-pr-feedback-loop", "pipeline-pr-feedback-loop"]
invocation: Use when review comments need implementation and revalidation.
required_skills:
  - ls-receiving-code-review
  - ls-test-driven-development
  - ls-github-pr-review
required_tools: []
required_docs: []
gates:
  - id: feedback_gate
    rule: Confirm actionable comments from human, Copilot, and other reviews against the reviewed PR head SHA and current diff; deduplicate the same defect before implementation.
phases:
  - id: triage_feedback
    summary: Bind reviews to the PR head SHA, recheck stale findings against the current diff, and deduplicate defects across human, Copilot, other reviews and deterministic checks.
  - id: implement_with_tests
    summary: Existing repository agents implement accepted fixes with focused test evidence; do not assign a cloud coding agent.
  - id: re_review
    summary: Request re-review only for materially changed risky code or a resolved substantial finding; unchanged code does not trigger another round. Copilot outage or exhausted allowance is advisory and never disables deterministic validation or enables a paid fallback.
validation:
  - check: Accepted findings retain reviewed head SHA and source references and map to implemented changes and applicable tests; duplicate defects have one disposition.
outputs:
  - PR feedback closure summary
smoke:
  - id: receiving_review_skill_present
    check: ls/skills/ls-receiving-code-review/SKILL.md exists
migration:
  source: ls/docs/WORKFLOW_QUICK_REF.md
  note: Details delegated to the underlying skills.
