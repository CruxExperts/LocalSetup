workflow_id: server-triage-patch-planning
display_name: Server Triage Patch Planning
aliases: ["server triage patch pipeline", "ls-workflow-pipeline-server-triage-patch", "pipeline-server-triage-patch"]
invocation: Use for read-only server baseline and service triage followed by patch-plan generation; this workflow performs no execution.
required_skills:
  - ls-system-baseline-diagnostics
  - ls-linux-service-triage
  - ls-linux-patch-planning
required_tools: []
required_docs:
  - ls/docs/WORKFLOW_QUICK_REF.md
gates:
  - id: read_only_boundary
    rule: Use supplied or separately authorized read-only evidence and stop before SSH, package-manager, container, service, or PatchMon execution.
  - id: plan_only_capability
    rule: Treat ls-linux-patch-planning output only as a patch plan; never claim that its bundled helper executes or verifies server changes.
  - id: separate_execution_handoff
    rule: Any later manual execution leaves this workflow and requires ls-system-changes-backup plus ls-wf-risky-operations-safety-approval and ls-wf-sudo-tmux-session with unchanged exact commands, values, targets, consequences, backup and rollback evidence, and explicit user approval at the point of risk.
phases:
  - id: baseline
    summary: Record target identity, constraints, and current read-only system evidence.
  - id: triage
    summary: Diagnose service symptoms from supplied status and log evidence without mutation.
  - id: patch_plan
    summary: Generate and review a plan without connecting to or changing a server.
validation:
  - check: Baseline and triage conclusions cite the supplied evidence and identify unresolved blockers.
  - check: Patch commands are labeled as unexecuted plan output with target and verification criteria.
  - check: No SSH, package, container, service, or PatchMon mutation is reported as performed.
outputs:
  - Read-only server baseline
  - Service triage report
  - Unexecuted patch plan
smoke:
  - id: patch_planner_present
    check: ls/skills/ls-linux-patch-planning/SKILL.md exists
migration:
  source: ls/docs/WORKFLOW_QUICK_REF.md
  note: Workflow composes baseline, triage, and patch planning without an execution phase.
