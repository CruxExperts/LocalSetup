name: Bug report
description: Report a reproducible problem
body:
  - type: markdown
    attributes:
      value: >-
        If this may be a security vulnerability, do not report it publicly. Use the
        repository's private security reporting route: [private vulnerability report](__SECURITY_REPORT_URL__).
        Redact secrets, credentials, and private filesystem paths from all details.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and its impact.
    validations:
      required: true
  - type: input
    id: client_platform
    attributes:
      label: Client or platform
      description: Include the relevant client or platform; enter "not platform-specific" when it does not apply.
      placeholder: e.g. browser name/version, operating system, CLI, or not platform-specific
    validations:
      required: true
  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to reproduce
      description: Include commands or UI actions, in order, with redacted example input where useful.
      placeholder: "1. Run ... or open ...\n2. Select ...\n3. Observe ..."
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual behavior
      description: What happened instead? Include relevant redacted errors.
  - type: input
    id: version
    attributes:
      label: Version
      description: Provide the affected application or dependency version when known.
      placeholder: e.g. v2.4.1 or unknown
  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Optional. Add a workflow-run URL, failing commit, last-known-good version, or other relevant context when available. Redact secrets and private paths.
