workflow_id: risky-operations-safety-approval
display_name: Risky Operations Safety Approval
aliases: ["lazy admin", "manual execution", "ls-workflow-ops-guarded", "ops-guarded"]
invocation: Use for risky operations that require classified impact, verified backup and rollback readiness, exact-target approval, and guarded execution or tmux handoff.
required_skills: [ls-localsetup-framework-changes, ls-safety-and-backup]
required_tools: []
required_docs:
  - ls/skills/ls-safety-and-backup/SKILL.md
  - ls/workflows/ls-wf-sudo-tmux-session/SKILL.md
gates:
  - id: risk_classification
    rule: Record the ls-safety-and-backup risk class, consequences, affected users, services, files, and persistent state before planning execution.
  - id: backup_and_rollback_review
    rule: Create and verify the required backup for sensitive configuration or persistent state, then record the exact rollback or restore action; otherwise record why no backup applies or the residual risk of a user-declined backup.
  - id: freeze_approval_payload
    rule: Freeze the exact command or edit, target, values, risk class, consequences, affected scope, backup result, rollback action, and safer manual option before requesting approval.
  - id: explicit_pre_execution_approval
    rule: Immediately before execution, obtain explicit user approval for the frozen exact command or edit, values, and target; any change invalidates approval and returns to the applicable earlier gate.
  - id: tmux_handoff_preconditions
    rule: For sudo, root/admin elevation, require_escalated, PTY, or interactive password work, hand off to ls-wf-sudo-tmux-session only after every prior gate passes and the frozen payload still matches; that workflow owns probe, sudo-ready exchange, run, status, and cancel.
phases:
  - id: classify
    summary: Classify risk and record consequences and affected scope.
  - id: prepare_recovery
    summary: Verify backup applicability, backup evidence, and rollback readiness.
  - id: confirm_exact_operation
    summary: Freeze command, values, and target and obtain explicit approval.
  - id: execute_or_handoff
    summary: Execute the exact approved action directly or through the managed tmux workflow.
  - id: verify
    summary: Capture result evidence and verify intended state without scope expansion.
validation:
  - check: Decision record contains risk class, affected scope, backup result, rollback action, and exact approved command or edit, values, and target.
  - check: Privileged or interactive execution evidence shows guarded approval preceded the ls-wf-sudo-tmux-session handoff.
outputs:
  - Guarded ops decision record
smoke:
  - id: safety_owner_present
    check: ls/skills/ls-safety-and-backup/SKILL.md exists
  - id: tmux_handoff_owner_present
    check: ls/workflows/ls-wf-sudo-tmux-session/SKILL.md exists
migration:
  source: ls/skills/ls-safety-and-backup/SKILL.md
  note: Compose the safety owner for pre-execution gates and the tmux workflow for privileged or interactive execution only.
