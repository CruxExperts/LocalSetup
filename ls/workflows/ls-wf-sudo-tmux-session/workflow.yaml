workflow_id: sudo-tmux-session
display_name: Sudo Managed Pane
aliases:
  - "tmux shared session"
  - "sudo tmux"
  - "elevated permissions"
  - "interactive sudo prompt"
  - "sudo password prompt handoff"
  - "require_escalated"
  - "pseudo-terminal ops"
  - "managed tmux ops"
  - "ls-workflow-ops-tmux-session"
  - "ops-tmux-session"
invocation: Use when commands need sudo, root/admin elevation, require_escalated, pseudo-terminal/PTY handling, interactive sudo or elevated terminal password prompts, or managed tmux run tracking through tmux_ops run/status evidence.
required_skills: [ls-system-changes-backup]
required_tools: [ls/tools/tmux_ops]
required_docs:
  - ls/docs/ops/tmux-ops-managed.md
  - ls/docs/ops/tmux-ops-remote.md
gates:
  - id: execution_authorization
    rule: Reuse the current user-approved task scope and verify the exact target, payload and effects. Destructive work requires its existing explicit scope approval and recovery plan. Credential readiness never grants command authority or requires routine reapproval.
  - id: probe_gate
    rule: Qualify exact parent, controller-owned pane, machine, primary prompt and empty input deterministically. Authenticate the exact privileged command in one invocation; cached sudo is only an observation.
phases:
  - id: pick_session
    summary: Reuse or create the actual caller-owned lower pane without another tab.
  - id: probe
    summary: Verify native identity and managed shell readiness without prompt guessing.
  - id: verify_execution_authorization
    summary: Confirm the approved exact payload still matches before transport.
  - id: run_and_watch
    summary: Run command with run_id and status tracking.
validation:
  - check: Run status captured with log path.
outputs:
  - Tmux run evidence
smoke:
  - id: tmux_ops_exists
    check: ls/tools/tmux_ops exists
migration:
  source: ls/docs/ops/tmux-ops-managed.md
  note: Package references managed and remote guidance.
