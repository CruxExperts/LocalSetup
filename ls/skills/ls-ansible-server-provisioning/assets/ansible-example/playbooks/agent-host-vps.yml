---
# Agent-host VPS setup playbook.
#
# Usage:
#   ansible-playbook -i inventory/hosts.yml playbooks/agent-host-vps.yml --limit new_server
#
# This is an untested Ubuntu example. Before relying on it, validate the exact
# image, provider, architecture, Ansible/core version, collection versions, and
# SSH/fail2ban assumptions in an isolated target.
#
# Requirements:
#   - Bootstrap SSH access as root with either an existing private key or --ask-pass
#   - common_deploy_user, common_deploy_ssh_pubkey, and ansible_ssh_private_key_file
#     (matching the supplied public key) in inventory or group_vars for final verification

- name: Initial server setup
  hosts: all
  gather_facts: yes
  become: yes

  pre_tasks:
    - name: Validate required bootstrap and final-verification variables
      ansible.builtin.assert:
        that:
          - common_deploy_user is defined
          - common_deploy_user | length > 0
          - common_deploy_ssh_pubkey is defined
          - common_deploy_ssh_pubkey | length > 0
          - ansible_ssh_private_key_file is defined
          - ansible_ssh_private_key_file | length > 0
        fail_msg: >-
          Required variables: common_deploy_user, common_deploy_ssh_pubkey, and
          ansible_ssh_private_key_file. Define them in inventory, group_vars, or
          extra variables; the private key must match common_deploy_ssh_pubkey.

  roles:
    - role: common
      tags: [common, base]
    - role: security
      tags: [security, hardening]
    - role: nodejs
      tags: [nodejs, runtime]
    - role: agent-host
      tags: [agent-host, app]

- name: Final verification
  hosts: all
  gather_facts: no
  become: no

  vars:
    ansible_user: "{{ common_deploy_user }}"
  pre_tasks:
    - name: Reset bootstrap SSH connection before final verification
      ansible.builtin.meta: reset_connection

  tasks:
    - name: Test SSH as the configured deploy user
      ansible.builtin.wait_for_connection:
        timeout: 30
      # The initial inventory connection uses the bootstrap account. Subsequent
      # inventory runs should use this account and key authentication.

    - name: Summary
      ansible.builtin.debug:
        msg: |
          VPS setup complete.

          Server: {{ inventory_hostname }} ({{ ansible_host }})
          User: {{ common_deploy_user }}

          Installed:
          - Essential packages
          - UFW firewall (22, 80, 443 open)
          - fail2ban (SSH protection)
          - Node.js
          - {{ agent_host_package_name | default('openclaw') }} sample agent package

          Security:
          - Root login disabled
          - Password auth disabled
          - SSH key required

          Next steps:
          1. ssh {{ common_deploy_user }}@{{ ansible_host }}
          2. {{ agent_host_executable | default('/usr/local/bin/openclaw') }} setup (or onboard)
          3. Configure credentials in /home/{{ common_deploy_user }}/.openclaw/openclaw.json,
             or set OPENCLAW_CONFIG_PATH for a different file.
          4. Run {{ agent_host_executable | default('/usr/local/bin/openclaw') }} gateway run
             in the foreground to verify configuration before enabling the service.
