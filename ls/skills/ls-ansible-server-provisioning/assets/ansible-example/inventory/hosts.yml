---
# Ansible inventory. Define role variables in inventory/group_vars/all.yml or
# the appropriate group/host vars; do not add unprefixed shadow defaults here.

all:
  vars:
    ansible_python_interpreter: /usr/bin/python3

  children:
    # === Example servers ===
    vps:
      hosts:
        example_vps:
          ansible_host: 203.0.113.10
          ansible_user: deploy
          ansible_ssh_private_key_file: "~/.ssh/id_ed25519_example"

        # New server template: bootstrap as root, then switch ansible_user to
        # common_deploy_user and configure key authentication after provisioning.
        # new_server:
        #   ansible_host: 203.0.113.20
        #   ansible_user: root
        #   ansible_ssh_private_key_file: "~/.ssh/id_ed25519_example"
        #   common_deploy_ssh_pubkey: "ssh-ed25519 AAAA... user@example"

    # === Agent-host instances ===
    agent_hosts:
      hosts:
        # Servers that run an npm-based agent service.
        # example_agent_host:
        #   ansible_host: 203.0.113.30
        #   ansible_user: deploy
        #   ansible_ssh_private_key_file: "~/.ssh/id_ed25519_example"
      vars:
        nodejs_version: "22"
        agent_host_package_name: openclaw
        agent_host_package_version: latest
        agent_host_executable: /usr/local/bin/openclaw
        agent_host_command_args: "gateway run"
        agent_host_service_name: openclaw
        agent_host_config_dir: "/home/{{ common_deploy_user }}/.openclaw"

    # === By Environment ===
    production:
      hosts:
        example_vps:

    staging:
      hosts: {}
