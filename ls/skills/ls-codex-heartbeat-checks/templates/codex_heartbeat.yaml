heartbeat:
  enabled: false
  interval_minutes: 15
  state_dir: .localsetup/state/codex-heartbeat
  stale_after_seconds: 3600
  task_queue_path: null

agent:
  enabled: false
  profile: heartbeat
  timeout_seconds: 1800

agent_profiles:
  heartbeat:
    client: codex
    launcher: resolved-path
    command: [codex, exec, --json, "{heartbeat_prompt}"]
    prompt_transport: argv
    prompt: Read HEARTBEAT.md, inspect queued heartbeat work, and produce a concise status report.

  lscli-heartbeat:
    client: lscli
    launcher: lscli
    executable: /explicit/bin/lscli
    profiles: /explicit/private/profiles.json
    profile: explicitly-selected-provider
    grant: /explicit/private/heartbeat-grant.json
    runtime_root: /explicit/protected/runtimes
    state_root: /explicit/private/lscli-state
    resource_parent: /sys/fs/cgroup/explicitly-delegated-parent
    prompt: Read the explicitly granted heartbeat context and perform one bounded task.
    timeout_seconds: 300
    request_limit: 8
    tool_limit: 16
    token_limit: 32768
    no_progress_seconds: 60
    output_limit_bytes: 4194304

hooks:
  before: []
  after: []

direct_command_policy:
  allow_git_writes: false
  allow_destructive: false
  allowlist: []
