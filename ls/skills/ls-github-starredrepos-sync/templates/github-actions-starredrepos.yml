name: Starredrepos sync

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without committing changes"
        required: true
        default: "true"

# Scheduled sync is intentionally opt-in. The repository-scoped GITHUB_TOKEN is
# often not enough for user-star synchronization or cross-repository archive
# updates; configure an explicitly scoped secret only after review.

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Verify GitHub context
        run: node ls/skills/ls-github-starredrepos-sync/scripts/verify-github-auth.mjs
        env:
          GH_TOKEN: ${{ secrets.STARREDREPOS_TOKEN || github.token }}
      - name: Preview sync
        run: node ls/skills/ls-github-starredrepos-sync/scripts/sync-starredrepos.mjs --dry-run
        env:
          GH_TOKEN: ${{ secrets.STARREDREPOS_TOKEN || github.token }}
