  - id: claude-code
    display_name: Claude Code
    variants:
      - id: claude-code-cli
        display_name: Claude Code CLI
        kind: cli
        support_status: supported
        research:
          status: verified
          checked_on: '2026-09-06'
          sources:
            - {kind: official_docs, url: 'https://code.claude.com/docs/en/skills.md'}
            - {kind: official_docs, url: 'https://code.claude.com/docs/en/memory.md'}
            - {kind: official_docs, url: 'https://code.claude.com/docs/en/settings'}
            - {kind: official_docs, url: 'https://code.claude.com/docs/en/goal'}
            - {kind: official_docs, url: 'https://code.claude.com/docs/en/claude-directory'}
        executables: [claude]
        policy:
          repo: {status: supported, resolution: hierarchy, paths: ['CLAUDE.md', '.claude/CLAUDE.md'], precedence_status: verified, ownership: shared, collision: preserve-unmanaged}
          global: {status: supported, resolution: single, paths: ['~/.claude/CLAUDE.md'], precedence_status: verified, ownership: client-native, collision: owned-block-only}
        config:
          repo: {status: supported, resolution: hierarchy, paths: ['.claude/settings.json', '.claude/settings.local.json'], precedence_status: unverified, ownership: shared, collision: preserve-unmanaged}
          global: {status: supported, resolution: single, paths: ['~/.claude/settings.json'], precedence_status: verified, ownership: client-native, collision: manual}
        skills:
          repo: {status: supported, resolution: single, paths: ['.claude/skills'], precedence_status: verified, ownership: shared, collision: preserve-unmanaged}
          global: {status: supported, resolution: single, paths: ['~/.claude/skills'], precedence_status: verified, ownership: client-native, collision: owned-entry-only}
        goal: {status: supported, kind: slash-command, commands: ['/goal', '/goal clear'], limits: {status: unverified}}
        permissions: {status: supported, controls: ['managed settings', 'permission rules']}
        state:
          repo: {status: supported, path: '.claude/state', ownership: localsetup-managed, collision: fail}
          global: {status: supported, path: '~/.claude/state', ownership: localsetup-managed, collision: fail}
        insertion:
          repo: {status: supported, encoding: utf-8, bom: preserve, frontmatter: preserve-before-block, shebang: reject, native_header: none, legal_offset: after-preamble, preserve_mode: true, preserve_owner: true, collision: owned-block-only, rollback: owned-block-removal}
          global: {status: supported, encoding: utf-8, bom: preserve, frontmatter: preserve-before-block, shebang: reject, native_header: none, legal_offset: after-preamble, preserve_mode: true, preserve_owner: true, collision: owned-block-only, rollback: owned-block-removal}
        verification: {classification: filesystem}
        rollback: {classification: managed-entry-removal}
        compatibility: {platform_id: claude-code, order: 20, native_config: symlink_or_reference, smoke_test_level: filesystem, verify_rules: [skills_visible, namespace_ls], rollback_class: managed-entry-removal}

        integration:
          lifecycle: active
          installation:
            method: manual
            instructions: Retain the native Claude skills adapter; qualify an exact CLI build before native behavior claims. Default personal paths are separate from CLAUDE_CONFIG_DIR overrides.
          qualification:
            catalog: implemented
            filesystem: verified
            host: not-run
            evidence:
              - {kind: filesystem, reference: ls/tests/test_claude_adapters.py}
              - {kind: documentation, reference: ls/docs/CLIENT_INTEGRATION_METADATA.md}
          limitations:
            - Ordinary native skill roots support external symlinks in current documentation; no common-root auto discovery, Cowork or plugin compatibility is implied.
            - Enterprise skills precede personal then project skills; plugin names are scoped and same-name skills precede legacy commands. Effective host discovery remains unqualified.
            - Nondefault or ambiguous CLAUDE_CONFIG_DIR blocks default personal writes and is reported by verification; recorded removal remains available without relocation.
            - Shared settings use primary cwd; local settings use version-dependent Git-root and worktree rules with exceptions. Metadata paths do not model a generic settings hierarchy.
            - Native goal is documented but requires trust and enabled hooks, evaluates transcript evidence with a model, and incurs provider usage. Goal prose is not a hard runtime or token budget.
            - Native configuration, approvals, rules, imports, custom skills and sessions remain user-owned; framework state is distinct from native state.

