schema_version: 1
id: codex-agent-team
display_name: Codex Agent Team Bootstrap
status: audit-ready
version: "1.0"
primary_platform: codex
future_platforms:
  - kilo
  - cursor
  - claude-code
  - openclaw
related_packs:
  - ls/docs/bootstrap-packs/opencode-agent-team/metadata.yaml
localsetup_pack: bootstrap
description: Generic Codex controller and subagent bootstrap pack with subagent-first throughput defaults, audit prompts, native config surfaces, and safe remediation boundaries.
source_of_truth:
  skill_workflow_pack_membership: ls/config/pack.yaml
  generated_skill_workflow_pack_index: ls/docs/_generated/skill-packs.md
  document_bundle_index: ls/docs/bootstrap-packs/INDEX.md
  docs_index: ls/docs/bootstrap-packs/INDEX.md
  audit_prompt: ls/docs/bootstrap-packs/codex-agent-team/AUDIT_PROMPT.md
native_codex_surfaces:
  global:
    - $CODEX_HOME/config.toml or ~/.codex/config.toml
    - $CODEX_HOME/AGENTS.md or ~/.codex/AGENTS.md
    - $CODEX_HOME/agents/*.toml or ~/.codex/agents/*.toml
    - $CODEX_HOME/AGENT_TEAM_RUNBOOK.md or ~/.codex/AGENT_TEAM_RUNBOOK.md
  repo:
    - AGENTS.md
    - ls/templates/codex/AGENTS.md
included_skills:
  - ls-localsetup-project-context
  - ls-response-style-tools
  - ls-docs-create-move
  - ls-localsetup-framework-audit
  - ls-localsetup-framework-changes
  - ls-git-merge-rebase
  - ls-github-pr-review
  - ls-safety-and-backup
  - ls-script-and-docs-quality
  - ls-task-skill-matcher
  - ls-test-runner
effective_install_skills:
  - ls-response-style-tools
  - ls-localsetup-project-context
  - ls-docs-create-move
  - ls-localsetup-framework-audit
  - ls-localsetup-framework-changes
  - ls-git-merge-rebase
  - ls-github-pr-review
  - ls-safety-and-backup
  - ls-script-and-docs-quality
  - ls-task-skill-matcher
  - ls-test-runner
  - ls-unfuck-my-git-state
skill_membership_note: included_skills lists direct pack.yaml membership; effective_install_skills also includes required skills from selected workflow packages.
included_workflows:
  - ls-wf-risky-operations-safety-approval
  - ls-wf-git-repair-hygiene
required_audit_artifacts:
  - ls/docs/audits/codex-bootstrap-pack/AUDIT_REPORT.md
  - ls/docs/audits/codex-bootstrap-pack/FINDINGS.yaml
  - ls/docs/audits/codex-bootstrap-pack/REMEDIATION_PLAN.md
  - ls/docs/audits/codex-bootstrap-pack/REMEDIATION_TASKS.yaml
  - ls/docs/audits/codex-bootstrap-pack/VALIDATION.md
  - ls/docs/audits/codex-bootstrap-pack/agent-reports/*.md
approval_boundaries:
  - home-directory writes
  - sibling-repo writes
  - global Codex config changes
  - permission changes outside the current repo
  - destructive replacement of legacy skills or prompts
operating_defaults:
  controller: Own requirements, task decomposition, state tracking, verification, and final acceptance while defaulting non-trivial work to subagent-first routing.
  direct_mode: Use only for trivial one-step tasks, simple questions, cases with no useful independent subtask, or active tool/mode constraints.
  delegation: Look for useful existing native role assignments before doing substantial work directly; do not create specialist role files by default.
  normal_fanout: 1-2 agents for non-trivial tasks; use 3 only for clearly independent discovery, research, or validation.
  no_write_modes: In Plan Mode or other no-write contexts, plan ledgers and subtasks but do not create or edit state until writes are allowed.
  roles:
    explorer: Map relevant files, systems, docs, workflows, data, dependencies, tests, and risks.
    researcher: Verify current or source-backed facts.
    worker: Execute one bounded task with exact write scope.
    tester: Run validations, benchmarks, measurements, and failure summaries.
    reviewer: Check final risk, correctness, regression, scope, and evidence.
    guardian_subagent: Review approval, permission, and rules decisions only.
validation_commands:
  - uv run --locked python ls/tools/localsetup.py --source-root . validate-catalog
  - uv run --locked python ls/tools/localsetup.py --source-root . plan --packs bootstrap
  - uv run --locked python ls/tools/generate_docs_artifacts.py --repo-root .
  - uv run --locked python ls/tools/localsetup.py --source-root . generate-docs
  - git diff --check
